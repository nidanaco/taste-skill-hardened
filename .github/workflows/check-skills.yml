name: Check hardened skill
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build disposable test runtime
        run: docker build -f tests/Dockerfile -t taste-hardened-test .
      - name: Run real-browser and security regressions without network or credentials
        run: python3 tests/run-isolated.py --image taste-hardened-test
