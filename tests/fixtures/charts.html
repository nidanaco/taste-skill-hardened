<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hardened chart sample</title><link rel="stylesheet" href="app.css"><style>main{max-width:960px;margin:auto;padding:24px 16px}h1{font-size:28px;line-height:1.2;margin-bottom:12px}.intro{color:var(--muted);margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}.sample{min-width:0;background:var(--surface);padding:20px;border:1px solid var(--border);border-radius:8px}.sample h2{font-size:16px;margin-bottom:12px}.wide{grid-column:1/-1}.chart{min-height:140px}</style></head><body><main><h1>Hardened chart sample</h1><p class="intro">Synthetic data only. Packaged chart helpers and app styles; system font fallback.</p><section class="grid"><article class="sample"><h2>Capacity</h2><div class="chart" id="ring"></div></article><article class="sample"><h2>Allocations</h2><div class="chart" id="bullet"></div></article><article class="sample wide"><h2>Requests over time</h2><div class="chart" id="line"></div></article><article class="sample"><h2>Workshop requests</h2><div class="chart" id="bars"></div></article><article class="sample"><h2>Resources against plan</h2><div class="chart" id="plan"></div></article></section></main><script src="charts.js"></script><script src="charts-fixture.js"></script></body></html>
